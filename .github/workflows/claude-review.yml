name: Claude PR Review
on:
  pull_request:
    types: [opened]
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review the pull request diff. Sử dụng công cụ GitHub để đăng nhận xét
            trực tiếp lên PR (inline comments theo từng dòng + một review tổng kết).
            Tập trung: lỗi logic, bảo mật, hiệu năng, code không theo chuẩn.
            Trả lời bằng tiếng Việt.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr review:*)"

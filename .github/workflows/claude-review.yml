name: Claude PR Review
on:
  pull_request:
    types: [opened]
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request. Tập trung vào: lỗi logic, vấn đề bảo mật,
            hiệu năng, và code không theo chuẩn dự án. Để lại nhận xét cụ thể
            theo từng file/dòng. Trả lời bằng tiếng Việt.

name: Claude PR Review
on:
  pull_request:
    types: [opened]
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review the diff of PR #${{ github.event.pull_request.number }}.
            Tập trung: lỗi logic, bảo mật, hiệu năng, code không theo chuẩn.

            QUAN TRỌNG: Sau khi phân tích xong, BẮT BUỘC đăng kết quả review
            lên PR bằng lệnh:
              gh pr comment ${{ github.event.pull_request.number }} --body "<nội dung review của bạn>"
            Viết nhận xét bằng tiếng Việt. Nếu không có vấn đề gì, vẫn phải
            đăng một comment ngắn xác nhận đã review và không phát hiện lỗi.
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*)"

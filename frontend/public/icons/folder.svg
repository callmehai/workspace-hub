<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="folderBack" x1="24" y1="10" x2="24" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#28B4F6"/>
      <stop offset="1" stop-color="#0E97ED"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="24" y1="18" x2="24" y2="39" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39BEFF"/>
      <stop offset="1" stop-color="#17A6F3"/>
    </linearGradient>
    <!-- gradient logo Google Drive (giống drive.svg app đang dùng) -->
    <radialGradient id="fdA" cx="-254.817" cy="705.837" gradientTransform="matrix(2.827,1.6322,-1.6322,2.827,1967.2161,-1760.7166)" gradientUnits="userSpaceOnUse" r="82.973">
      <stop offset="0" stop-color="#ffd24d"/><stop offset="1" stop-color="#f6c338"/>
    </radialGradient>
    <radialGradient id="fdB" cx="-254.82" cy="705.836" gradientTransform="matrix(2.827,1.6322,-1.6322,2.827,1967.2161,-1760.7166)" gradientUnits="userSpaceOnUse" r="82.978">
      <stop offset="0" stop-color="#4387fd"/><stop offset=".65" stop-color="#3078f0"/><stop offset=".91" stop-color="#2b72ea"/><stop offset="1" stop-color="#286ee6"/>
    </radialGradient>
  </defs>

  <!-- Phóng to toàn bộ icon (1.2x quanh tâm) cho folder đầy khung hơn -->
  <g transform="translate(24 24) scale(1.2) translate(-24 -24)">

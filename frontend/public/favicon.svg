<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Workspace Hub — app icon: hub & spokes.
       Node trung tâm + 6 nhánh toả ra node nguồn = gom nhiều nguồn về một hub. -->
  <defs>
    <linearGradient id="wh-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#wh-bg)"/>
  <g stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.85">
    <line x1="16" y1="16" x2="16"   y2="7.5"/>
    <line x1="16" y1="16" x2="23.4" y2="11.8"/>
    <line x1="16" y1="16" x2="23.4" y2="20.2"/>
    <line x1="16" y1="16" x2="16"   y2="24.5"/>
    <line x1="16" y1="16" x2="8.6"  y2="20.2"/>
    <line x1="16" y1="16" x2="8.6"  y2="11.8"/>
  </g>
  <g fill="#fff">
    <circle cx="16"   cy="7.5"  r="2"/>
    <circle cx="23.4" cy="11.8" r="2"/>
    <circle cx="23.4" cy="20.2" r="2"/>
    <circle cx="16"   cy="24.5" r="2"/>
    <circle cx="8.6"  cy="20.2" r="2"/>
    <circle cx="8.6"  cy="11.8" r="2"/>
  </g>
  <circle cx="16" cy="16" r="3.4" fill="#fff"/>
  <circle cx="16" cy="16" r="1.5" fill="#2563eb"/>
</svg>

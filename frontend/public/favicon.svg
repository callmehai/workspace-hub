<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 32 32">
  <!-- Workspace Hub — app icon
       Rounded-square badge in brand blue; white mark = Kanban 3 cột
       (Cần xem / Đang xử lý / Done) với item card ở mỗi cột. -->
  <defs>
    <linearGradient id="wh-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#wh-bg)"/>
  <!-- 3 kanban columns, tiến độ tăng dần trái→phải -->
  <g fill="#fff">
    <rect x="7"  y="8"  width="5" height="16" rx="1.6" fill-opacity="0.55"/>
    <rect x="13.5" y="8"  width="5" height="16" rx="1.6" fill-opacity="0.78"/>
    <rect x="20" y="8"  width="5" height="16" rx="1.6"/>
  </g>
  <!-- item cards nằm trong cột -->
  <g fill="#2563eb">
    <rect x="8.2"  y="9.4"  width="2.6" height="2.6" rx="0.7" fill-opacity="0.9"/>
    <rect x="14.7" y="9.4"  width="2.6" height="2.6" rx="0.7"/>
    <rect x="14.7" y="13"   width="2.6" height="2.6" rx="0.7"/>
    <rect x="21.2" y="9.4"  width="2.6" height="2.6" rx="0.7"/>
    <rect x="21.2" y="13"   width="2.6" height="2.6" rx="0.7"/>
    <rect x="21.2" y="16.6" width="2.6" height="2.6" rx="0.7"/>
  </g>
</svg>
